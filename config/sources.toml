# Data sources for the pipeline. `transit download` fetches every entry with a `fetch`
# method; `transit load` loads every entry with a `table`.
#
# Fields:
#   name, publisher
#   url         direct download (or service endpoint)
#   landing     the dataset's page, when `url` is a direct download (the site links
#               the landing page, else `url`)
#   fetch       how `transit download` gets it: "http" (plain file), "zip" (download +
#               unzip into local_dir), "arcgis" (ogr2ogr from an ArcGIS FeatureServer
#               layer into a GeoPackage), "manual" (download by hand; see notes)
#   local_path  the file the loader reads, relative to repo root
#   format      as delivered
#   layer       layer name inside the download, if multi-layer
#   table       raw.<table> to load into
#   crs         as delivered
#   license     license / terms of use, plus required attribution
#   attribution credit line the site shows
#   retrieved   date downloaded for the current build (YYYY-MM-DD)
#   verified    true once inspected during recon
#   notes       recon findings

[gtfs]
name = "Madison Metro Transit GTFS"
publisher = "City of Madison, Metro Transit"
url = "https://transitdata.cityofmadison.com/GTFS/mmt_gtfs.zip"
landing = "https://www.cityofmadison.com/metro/business/information-for-developers"
fetch = "zip"
local_path = "data/raw/gtfs/mmt_gtfs"
format = "gtfs"
table = "gtfs"          # -> raw.gtfs_<file> (all columns text)
crs = "EPSG:4326"
license = "Metro Transit Data Developer License Agreement and Terms of Use (terms_of_use.txt in the feed; https://www.cityofmadison.com/metro/business/information-for-developers/developer-license-agreement-and-terms-of-use). Non-exclusive right to use, reproduce and redistribute, limited to uses 'assisting mass transit riders or in furtherance of promoting public transportation'. Credit is optional; if given it must read exactly the attribution below. Data is as-is; licensee indemnifies the City."
attribution = "Data provided under license granted by City of Madison, WI, Metro Transit."
retrieved = "2026-10-19"
verified = true
notes = """
Feed S072_202608240858, valid 2026-08-16 to 2026-12-05. 1,681 stops (1,659 used by
stop_times), 29 routes (A, B BRT; C-W lettered; 28-84 numbered), 14,198 trips,
603,661 stop_times. No frequencies.txt entries (all trips explicit).

parent_station: only the 19 BRT stations (location_type=1) have children (38
platforms, 2 each). Every other stop is standalone, so merging needs distance
clustering (decision 2026-10-19). Example clusters:
  - E Washington & North: 185 'North at E Washington' (B, D), 2859/2860
    'Milwaukee-North' (A, B) 55-81 m apart; 183 'Milwaukee at E Washington' (D) 108 m.
  - W Johnson & East Campus Mall (owner): 2843 'East Campus' (A, B, F) and 2866
    'W Johnson at East Campus' (28, 38, 65, C, D, R), same direction, 53 m apart.
Nearest-neighbour stop distance: median 46 m (opposite sides of a street), 90th pct
117 m.

Extended stops.txt fields (extended_data_dictionary.txt): cardinal_direction (vehicle
heading 0/90/180/270), relative_position (1 after / 2 adjacent / 3 before / 4
opposite cross street / 5 drive aisle), primary_street, cross_location,
jurisdiction_id (CMAD, CFIT, CMID, CSUN, CMON, CVER, VSHO, UWIS, MTSM ...).

Service calendar (trips per day): Mon-Thu with UW in session = service 9 (1,672
trips); Mon-Thu outside the semester = 4 (1,608); Fri 11 (1,678) / 1; Sat 12 (940);
Sun 8 (825); holidays 2/3/5/6/7/10. Representative dates are picked automatically as
the most common service set per day type (pipeline.toml [frequency]).
"""

[osm]
name = "OpenStreetMap Wisconsin extract"
publisher = "Geofabrik"
url = "https://download.geofabrik.de/north-america/us/wisconsin-latest.osm.pbf"
landing = "https://download.geofabrik.de/north-america/us/wisconsin.html"
fetch = "http"
local_path = "data/raw/osm/wisconsin-latest.osm.pbf"
format = "pbf"
table = "osm"           # -> raw.osm_ways / osm_nodes / osm_pois (pyosmium, see osm.py)
crs = "EPSG:4326"
license = "ODbL 1.0"
attribution = "© OpenStreetMap contributors"
retrieved = "2026-10-17"
verified = true
notes = """
Copied from ../public-private-shore (Geofabrik, 2026-10-17). Study-area cut
(-89.60,42.96,-89.17,43.225): 18 MB; highways only: 6 MB.

Pedestrian network recon (2026-10-19, km in the study bbox):
  footway=sidewalk 2,672 | residential 2,739 | service 2,661 | footway (untagged) 792
  tertiary 667 | secondary 399 | path 394 | cycleway 380 | primary 235
  footway=crossing 186 | pedestrian 87 | trunk 43 | motorway 265 (excluded)
Sidewalks are mapped as separate ways almost everywhere in Madison, but roads rarely
say so (secondary: 18 km sidewalk=separate, 320 km untagged). Detect separate
sidewalks geometrically if needed; don't trust the sidewalk=* tag.
Crossings: ~4,600 footway=crossing ways (crossing=unmarked/uncontrolled/marked/
traffic_signals, crossing:markings, crossing:signals) and ~16,800 highway=crossing
nodes; 1,170 highway=traffic_signals nodes. Good enough for barrier-style crossings.
"""

