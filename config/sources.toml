[ridership]
name = "Metro Ridership by Stop (weekday, February 2024)"
publisher = "Greater Madison MPO (City of Madison open data)"
url = "https://maps.cityofmadison.com/arcgis/rest/services/Public/OPEN_DATA_TRANS/MapServer/64"
landing = "https://data-cityofmadison.opendata.arcgis.com/datasets/9a7ae28a964d4fe9a9d7e8888febb157"
fetch = "arcgis"
local_path = "data/raw/ridership/ridership_by_stop.gpkg"
format = "gpkg"
table = "ridership"
crs = "EPSG:4326"
license = "City of Madison Data Policy (https://www.cityofmadison.com/policy/data): provided for informational purposes, no warranty, no attribution requirement."
attribution = "Greater Madison MPO, Metro Transit ridership by stop (February 2024)"
retrieved = "2026-10-20"
verified = false
notes = """
Calibrates the catchment score (pipeline/sql/70_validation, `transit fit`): fitted
weights and each stop's observed vs. expected boardings. Average weekday boardings per stop from a 19-day
sample of farebox records and AVL logs (estimated stop per fare transaction); excludes
school-day supplemental routes and paratransit. Fields: Weekday (total), one column per
route (A, B, ..., F28...), stop_code, stop_name, stop_lat/lon. The publisher cautions
against comparing individual stops. Pre-BRT: Route A here is the June 2023 network's A,
before the BRT opened (September 2024). A newer APC-based estimate (April 2025) exists
only as a PDF map:
https://www.cityofmadison.com/mpo/documents/maps--gis/print-maps/transportation-infrastructure/Ridership_By_Stop.pdf
"""

[nhts]
name = "2022 NextGen National Household Travel Survey (public use, v2.1)"
publisher = "Federal Highway Administration / Oak Ridge National Laboratory"
url = "https://nhts.ornl.gov/media/2022/download/csv.zip"
landing = "https://nhts.ornl.gov/"
fetch = "zip"
local_path = "data/raw/nhts/tripv2pub.csv"
format = "csv"
license = "U.S. government work, public domain; cite as in the Citation.pdf in the download."
attribution = "FHWA, 2022 National Household Travel Survey"
retrieved = "2026-10-21"
verified = true
notes = """
Sets each destination group's share of trips (`transit purposes` -> gen.purpose_shares;
config/trip_purposes.csv maps WHYTO codes to groups, config/destination_groups.csv
maps POI categories to groups). Trip file: WHYTO (purpose at the destination),
TRIPMODE (03 = public transit), URBAN (01 = in an urban area), WTTRDFIN (trip weight).
Codebook: https://nhts.ornl.gov/media/2022/doc/codebook.pdf. National sample: 7,893
households, 31k trips, only 341 by transit (100 to a destination), too few for
transit-only shares; urban trips (9.2k to a destination) are used instead. Checked
against boardings (2026-10-21): urban shares beat the hand weights in 20 of 20
cross-validation splits; transit-only shares did worse.
"""

