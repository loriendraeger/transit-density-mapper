[project]
name = "transit"
version = "0.1.0"
description = "Madison transit stop catchments: raw data -> PostGIS/pgRouting -> tiles + stats"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "osmium>=4.0",
    "psycopg[binary]>=3.2",
    "r5py>=1.1.7",
    "scipy>=1.14",
    "shapely>=2.0",
    "typer>=0.12",
]

[project.scripts]
transit = "transit.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
